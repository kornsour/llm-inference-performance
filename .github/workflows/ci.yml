name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Primary target is 3.14; 3.12 is the supported floor, tested to prove the range.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (CPU torch)
        run: uv pip install --system -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src benchmarks scripts tests

      - name: Tests (incl. 2-proc gloo tensor parallelism)
        run: pytest

      - name: Smoke benchmark
        run: python benchmarks/run_all.py --quick

      # Gates on scripts/bench_compare.py's own (more-repeats-than-the-smoke-
      # test) `quick` config against the row flagged `is_baseline` in
      # benchmarks/results/history.duckdb for that exact configuration — see
      # docs/bench-compare.md. Runs on one Python version only: the baseline
      # is version-specific (see llminf.history.CONFIG_COLUMNS) and only one
      # is recorded, so the other leg would just print "no baseline yet"
      # every time — no reason to spend the run on it.
      - name: Compare benchmark vs. baseline
        if: matrix.python-version == '3.14'
        run: python scripts/bench_compare.py

      - name: Upload benchmark JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/*.json
          if-no-files-found: ignore

  # TEMPORARY — bootstraps the very first bench-compare baseline + noise
  # measurement for docs/bench-compare.md on a real GitHub Actions
  # ubuntu-latest runner, from inside this PR (`workflow_dispatch` workflows
  # — bench-baseline.yml / bench-noise.yml, which do this from here on out —
  # can't be dispatched until they exist on the default branch). Removed in
  # a follow-up commit on this same PR once its output is captured; not part
  # of the feature.
  bootstrap-baseline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies (CPU torch)
        run: uv pip install --system -e ".[dev]"

      - name: Noise calibration (n=10)
        run: python scripts/bench_noise.py -n 10

      - name: Record the quick-config baseline
        run: python scripts/bench_compare.py --update-baseline | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit and push the baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/results/history.duckdb
          if git diff --cached --quiet; then
            echo "No change to commit."
          else
            git commit -m "chore(bench): bootstrap the quick bench-compare baseline [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi

  # The CUDA kernel is dispatched to only on a GPU, so nothing in `test` ever
  # compiles it — which is exactly how it shipped broken. nvcc needs no GPU to
  # compile and link, so this runs on an ordinary runner and closes that gap.
  cuda-kernel-build:
    name: CUDA kernel compiles + links (no GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The CUDA toolkit and a CUDA torch wheel are several GB between them;
      # the stock runner image does not leave room without this.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 12.6 pairs with the cu126 torch wheel below, which is the same torch
      # version the CPU jobs run — so this catches ATen/c10 API drift too, not
      # just the wiring.
      - name: Install CUDA toolkit (nvcc + cudart only)
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-toolkit
        with:
          cuda: "12.6.3"
          method: network
          sub-packages: '["nvcc", "cudart", "cudart-dev"]'

      - name: Install torch (CUDA build)
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy "torch==2.13.0" \
            --index-url https://download.pytorch.org/whl/cu126 \
            --extra-index-url https://pypi.org/simple

      - name: Build the extension, and prove the check rejects both defects
        env:
          CUDA_HOME: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}
          # Without this torch tries to read the arch off a local GPU and dies
          # in _get_cuda_arch_flags. 8.6/8.9 are the cards this repo runs on.
          TORCH_CUDA_ARCH_LIST: "8.6;8.9+PTX"
        run: python scripts/check_kernel_builds.py --self-test
