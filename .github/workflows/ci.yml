name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Primary target is 3.14; 3.12 is the supported floor, tested to prove the range.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (CPU torch)
        run: uv pip install --system -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src benchmarks scripts tests

      - name: Tests (incl. 2-proc gloo tensor parallelism)
        run: pytest

      - name: Smoke benchmark
        run: python benchmarks/run_all.py --quick

      - name: Upload benchmark JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/*.json
          if-no-files-found: ignore
