[project]
name = "llm-inference-performance"
version = "0.1.0"
description = "LLM inference performance engineering: a benchmark harness (p50/p95 latency, tokens/sec, memory) and measured before/after optimizations — KV-cache, batching, int8 quantization — plus a tensor-parallel MLP + all-reduce micro-benchmark (gloo/NCCL) and a custom CUDA kernel."
readme = "README.md"
# Developed, tested, and documented on Python 3.14; 3.12 is the supported floor
# (the torch build is the real constraint on the lower bound).
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Andrew Kaiserauer" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llminf"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E741"]
